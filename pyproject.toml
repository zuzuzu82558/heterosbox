[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heterosbox*"]

[project]
name = "heterosbox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "fastapi>=0.115", "simpleeval>=1,<2", "jsonschema>=4,<5", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
